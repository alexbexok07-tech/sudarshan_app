name: Build Signed SudarshanCloud Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="SudarshanCloud-AdMob-connected.zip"
          if [[ ! -f "$archive" ]]; then
            echo "Could not find $archive in the repository root."
            echo "Top-level files in this repository:"
            ls -la
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$archive" -d android-project
          if [[ ! -f android-project/gradlew || ! -f android-project/settings.gradle.kts || ! -f android-project/app/build.gradle.kts ]]; then
            echo "ZIP extracted, but the expected Android project files were not found at its top level."
            echo "Extracted top-level files:"
            find android-project -maxdepth 3 -type f | sort | head -100
            exit 1
          fi
          echo "Android project extracted successfully."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android-project/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing repository secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/sudarshan-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build and test signed release APK
        shell: bash
        working-directory: android-project
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REWARDS_API_BASE_URL: ${{ vars.REWARDS_API_BASE_URL }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${STORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_PASSWORD repository secret."
            exit 1
          fi
          chmod +x ./gradlew
          gradle_args=(--no-daemon --stacktrace)
          if [[ -n "${REWARDS_API_BASE_URL:-}" ]]; then
            gradle_args+=("-PREWARDS_API_BASE_URL=${REWARDS_API_BASE_URL}")
          fi
          if [[ -n "${ADMOB_REWARDED_AD_UNIT_ID:-}" ]]; then
            gradle_args+=("-PADMOB_REWARDED_AD_UNIT_ID=${ADMOB_REWARDED_AD_UNIT_ID}")
          fi
          ./gradlew "${gradle_args[@]}" testDebugUnitTest assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: SudarshanCloud-signed-release-APK
          path: android-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
