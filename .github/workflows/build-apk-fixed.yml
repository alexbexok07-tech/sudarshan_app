name: Build SudarshanCloud APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          if [ -z "${zip_file}" ]; then
            echo "No project ZIP found in the repository."
            exit 1
          fi
          echo "Using project archive: ${zip_file}"
          rm -rf project
          mkdir -p project
          unzip -q "${zip_file}" -d project
          if [ ! -f project/gradlew ]; then
            echo "The ZIP must contain gradlew at its root."
            echo "Top-level project files:"
            find project -maxdepth 2 -type f -print | sort | head -100
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # v3 of setup-android can request the obsolete SDK 'tools' package.
      # Google no longer serves that package. v4 supports skipping it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK successfully created:"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SudarshanCloud-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
